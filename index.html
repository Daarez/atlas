        function isValidHistoricalToponym(word) {
            if (!word || word.length < 3 || word.length > 26) return false;
            const clean = word.replace(/[^A-Za-zÄÖÜäöüßŚĆŻŹŁŃśćżźłńА-Яа-яЁёІіЇїЄєҐґ\-\s]/g, '').trim();
            if (clean.length < 3) return false;
            if (TOPONYM_STOPWORDS.has(clean.toLowerCase())) return false;
            if (/^(Województwo|Powiat|Gmina|Pomorskie|Gdański|Polska|Polsce|Niemcy|Deutschland)$/i.test(clean)) return false;
            return true;
        }

        // Расширенный парсер исторических названий (ловит "до XXXX года — ...", "нем. ...", скобки и экзонимы)
        function extractOldNamesFromWikiText(text) {
            const found = new Set();

            // 1. Сначала проверяем словарь известных исторических экзонимов
            [currentPlaceLocalName, currentPlaceIntlCity].filter(Boolean).forEach(nameKey => {
                const lowKey = nameKey.toLowerCase().trim();
                if (HISTORICAL_EXONYMS_DB[lowKey]) {
                    HISTORICAL_EXONYMS_DB[lowKey].forEach(ex => found.add(ex));
                }
            });

            if (text) {
                const intro = text.slice(0, 900);

                // 2. Конструкции вида "до 1921 года — Александровск", "до 1945 — Данциг", "ранее — ..."
                const untilYearRegex = /(?:до\s+\d{4}(?:\s*[-—]\s*\d{4})?\s*(?:года|годов|р\.|року|r\.)?|ранее|бывш[а-я\.]*|dawniej|formerly)(?:\s+носил\s+название|\s+назывался)?\s*[—\-:]?\s*([A-ZÄÖÜŚĆŻŹŁА-ЯЁІЇЄҐ][a-zäöüßśćżźńłа-яёіїєґ\u0301\-]{3,22})/gi;
                let mUntil;
                while ((mUntil = untilYearRegex.exec(intro)) !== null) {
                    const cleanW = mUntil[1].replace(/\u0301/g, '').trim();
                    if (isValidHistoricalToponym(cleanW)) {
                        found.add(cleanW);
                        const latTr = translitCyrToLat(cleanW);
                        if (latTr && isValidHistoricalToponym(latTr)) found.add(latTr);
                    }
                }

                // 3. Явные языковые маркеры: (нем. Danzig, укр. Олександрівськ, пол. ..., лат. ...)
                const markerRegex = /(?:нем\.|niem\.|нем:|ger\.|german:?|dawniej|formerly|hist\.|кашуб\.|kaszb\.|латин\.|лат\.|пол\.|укр\.)\s*[:\-—]?\s*([A-ZÄÖÜŚĆŻŹŁА-ЯЁІЇЄҐ][a-zäöüßśćżźńłа-яёіїєґ\u0301\-]{2,22})/gi;
                let m;
                while ((m = markerRegex.exec(intro)) !== null) {
                    const candidate = m[1].replace(/\u0301/g, '').trim();
                    if (isValidHistoricalToponym(candidate)) {
                        found.add(candidate);
                        const latTr = translitCyrToLat(candidate);
                        if (latTr && isValidHistoricalToponym(latTr)) found.add(latTr);
                    }
                }

                // 4. Латинские топонимы в скобках первого предложения: "Łęgowo (niem. Langenau)"
                const firstSentence = intro.split('. ')[0] || '';
                const parenMatch = firstSentence.match(/\(([^)]{3,160})\)/);
                if (parenMatch) {
                    const latinWords = parenMatch[1].match(/[A-ZÄÖÜŚĆŻŹŁ][a-zäöüßśćżźńł\-]{3,20}/g) || [];
                    latinWords.forEach(w => {
                        if (isValidHistoricalToponym(w)) found.add(w);
                    });
                }
            }

            return Array.from(found).slice(0, 7);
        }

        function extractHistoricalSectionText(fullText, fallbackIntro) {
            if (!fullText) return fallbackIntro || '';
            const firstPara = fullText.split('\n').filter(p => p.trim().length > 35)[0] || fallbackIntro || '';
            const histMatch = fullText.match(/==\s*(История|Історія|Historia|Geschichte|Древняя история|Происхождение названия)[^=]*==([\s\S]{80,1800})/i);
            if (histMatch && histMatch[2]) {
                const cleanSec = histMatch[2].replace(/===+[^=]+===+/g, ' ').replace(/\n+/g, ' ').trim();
                return `<b>${firstPara.slice(0, 340)}</b><br><br>📜 <b>Из летописи локации:</b> ${cleanSec.slice(0, 640)}...`;
            }
            const paragraphs = fullText.split('\n').filter(p => p.trim().length > 50);
            const histParas = paragraphs.slice(1).filter(p => /\b(век|ст\.|wiek|Jahrhundert|основан|упоминает|крепост|замок|костёл|колони|поместь|рыцар|1[0-8]\d{2}|19[0-3]\d)\b/i.test(p));
            if (histParas.length > 0) {
                return `<b>${firstPara.slice(0, 340)}</b><br><br>📜 <b>Из летописи локации:</b> ${histParas[0].slice(0, 600)}...`;
            }
            return paragraphs.slice(0, 2).join('<br><br>').slice(0, 720);
        }

        async function exploreWorldPoint(lat, lon, explicitName = null) {
            const reqId = ++currentRequestId;
            currentCoords = [lat, lon];
            if (modernMap) {
                modernMarker.setLatLng(currentCoords);
                searchCircle.setLatLng(currentCoords);
                historicCircle.setLatLng(currentCoords);
                modernMap.setView(currentCoords, 12);
            }

            const scanImg = document.getElementById('archiveScanImg');
            if (scanImg) {
                scanImg.classList.remove('loaded');
                scanImg.src = '';
            }
            document.getElementById('currentLocBadge').innerText = `⏳ Анализ точки...`;

            try {
                const [resLocal, resEn] = await Promise.all([
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=14&accept-language=${currentLang}`),
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=13&accept-language=en`)
                ]);
                if (reqId !== currentRequestId) return;
                const dataLocal = await resLocal.json();
                const dataEn = await resEn.json();

                const addrLoc = dataLocal.address || {};
                const addrEn = dataEn.address || {};

                currentPlaceLocalName = explicitName || addrLoc.city || addrLoc.town || addrLoc.village || addrLoc.hamlet || addrLoc.municipality || addrLoc.county || `${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`;
                currentPlaceIntlCity = addrEn.city || addrEn.town || addrEn.village || addrEn.hamlet || addrEn.municipality || '';
                currentPlaceIntlCounty = (addrEn.county || '').replace(/\b(County|Powiat|District|Raion)\b/gi, '').trim();
                currentPlaceIntlState = cleanHistoricalRegionName(addrEn.state || addrEn.region || '');
                currentPlaceIntlCountry = addrEn.country || '';
            } catch (e) {
                if (reqId !== currentRequestId) return;
                currentPlaceLocalName = explicitName || `${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`;
                currentPlaceIntlCity = currentPlaceLocalName;
                currentPlaceIntlCounty = '';
            }

            document.getElementById('currentLocBadge').innerText = `📍 ${currentPlaceLocalName}`;
            await updateGlobalPassportAndMaps(reqId);
        }

        // ПАРСЕР ИСТОРИЧЕСКОГО ГОДА (проверяет Title, DateTimeOriginal, DateTime, Categories, ImageDescription, ObjectName)
        function extractStrictHistoricalYear(titleStr, extMeta) {
            let combined = titleStr || '';
            if (extMeta) {
                ['DateTimeOriginal', 'DateTime', 'ObjectName', 'Categories', 'ImageDescription'].forEach(field => {
                    if (extMeta[field] && extMeta[field].value) {
                        combined += ' ' + String(extMeta[field].value).replace(/<[^>]+>/g, ' ').slice(0, 400);
                    }
                });
            }

            // Отсекаем файлы, где в самом названии явно указан современный год (1946–2029) и нет старого года
            const titleModernYears = (titleStr || '').match(/\b(19[4-9]\d|20[0-2]\d)\b/g);
            const titleHistYears = (titleStr || '').match(/\b(1[0-8]\d{2}|19[0-3]\d|194[0-5])\b/g);
            if (titleModernYears && !titleHistYears) {
                return null;
            }

            // 1. Точный исторический год (1000–1945) прямо в названии файла (высший приоритет)
            if (titleHistYears && titleHistYears.length > 0) {
                for (const yStr of titleHistYears) {
                    const y = parseInt(yStr, 10);
                    if (y >= 1000 && y <= 1945) return y;
                }
            }

            // 2. Точный исторический год (1000–1945) в метаданных / категориях / описании
            const metaHistYears = combined.match(/\b(1[0-8]\d{2}|19[0-3]\d|194[0-5])\b/g);
            if (metaHistYears && metaHistYears.length > 0) {
                for (const yStr of metaHistYears) {
                    const y = parseInt(yStr, 10);
                    if (y >= 1000 && y <= 1945) return y;
                }
            }

            // 3. Явное указание исторического века (12th–19th century / XV–XIX w. / Jh.)
            const centuryEn = combined.match(/\b(1[1-9])th[-_\s]?(?:century|c\.)\b/i);
            if (centuryEn) {
                const c = parseInt(centuryEn[1], 10);
                const y = (c - 1) * 100 + 50;
                if (y <= 1945) return y;
            }
            const romanMap = { 'XII': 1150, 'XIII': 1250, 'XIV': 1350, 'XV': 1450, 'XVI': 1550, 'XVII': 1650, 'XVIII': 1750, 'XIX': 1850 };
            const romanMatch = combined.match(/\b(XII|XIII|XIV|XV|XVI|XVII|XVIII|XIX)\s*(?:wiek|w\.|ст\.|век|Jh\.)/i);
            if (romanMatch && romanMap[romanMatch[1].toUpperCase()]) {
                return romanMap[romanMatch[1].toUpperCase()];
            }

            // 4. Известные исторические картографы и атласы (если год не написан цифрой, но указан автор XVI–XIX вв.)
            if (/\b(Merian|Blaeu|Ortelius|Mercator|Homann|Seutter|Lotter|Speed|Münster|Schedel|Waghenaer|Hondius|Janssonius)\b/i.test(combined)) {
                return 1650;
            }
            if (/\b(Meyers|Brockhaus|Baedeker|Reymann|Messtischblatt|Шуберт|Стрельбицкий|Трёхверстовка)\b/i.test(combined)) {
                return 1890;
            }

            return null;
        }

        function isCleanHistoricalObject(title) {
            return !/ракетн|удар|обстрел|война\s+в|выборы|чемпионат|происшеств|катастроф|дтп|covid|остановочный пункт|toll|poboru opłat/i.test(title);
        }

        function isDisambiguationPage(page, extractText) {
            if (!page) return true;
            if (page.pageprops && ('disambiguation' in page.pageprops)) return true;
            const t = (page.title || '').toLowerCase();
            if (t.includes('значения') || t.includes('ujednoznacznienie') || t.includes('disambiguation') || t.includes('begriffsklärung') || t.includes('значення')) return true;
            if (extractText && /^[^.\n]{0,140}(ряд населённых пунктов|многозначный термин|w Polsce:|список значень|may refer to|steht für:)/i.test(extractText.trim())) return true;
            return false;
        }

        // ИСПРАВЛЕННЫЙ ПОИСК СТАТЬИ О НАСЕЛЁННОМ ПУНКТЕ (Никогда не берет Консерваторию вместо Киева!)
        async function fetchBestCityArticle(wikiLang, lat, lon) {
            const langPriority = Array.from(new Set([
                wikiLang,
                currentPlaceIntlCountry === 'Poland' ? 'pl' : (currentPlaceIntlCountry === 'Ukraine' ? 'uk' : (currentPlaceIntlCountry === 'Germany' ? 'de' : 'en')),
                'pl', 'uk', 'ru', 'de', 'en'
            ]));

            const targetNames = [currentPlaceLocalName, currentPlaceIntlCity]
                .filter(Boolean)
                .map(n => n.toLowerCase().replace(/\s*\([^)]*\)/g, '').trim());

            // Шаг 1: Сначала ищем точное совпадение названия населённого пункта в geosearch (радиус 5 км)
            // Для малых сёл ("Łęgowo (powiat gdański)") это сразу находит точный географический pageid именно этого села!
            // Для крупных городов ("Киев", "Гданьск") это игнорирует "Киевскую консерваторию" и берет только сам город!
            for (const lang of langPriority) {
                try {
                    const geoRes = await fetchWikimediaJsonp(`https://${lang}.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lon}&gsradius=5000&gslimit=15`);
                    const items = (geoRes && geoRes.query && geoRes.query.geosearch) ? geoRes.query.geosearch : [];
                    if (items.length === 0) continue;

                    // Строгая проверка: название статьи без скобок должно совпадать с названием города/села!
                    const matchedGeo = items.find(it => {
                        const cleanIt = it.title.toLowerCase().replace(/\s*\([^)]*\)/g, '').trim();
                        return targetNames.some(tn => cleanIt === tn);
                    });

                    if (matchedGeo && matchedGeo.pageid) {
                        const pageData = await fetchWikimediaJsonp(`https://${lang}.wikipedia.org/w/api.php?action=query&pageids=${matchedGeo.pageid}&prop=extracts|pageprops&explaintext=1&redirects=1`);
                        if (pageData && pageData.query && pageData.query.pages) {
                            const page = pageData.query.pages[matchedGeo.pageid] || Object.values(pageData.query.pages)[0];
                            if (page && page.extract && page.extract.length > 70 && !isDisambiguationPage(page, page.extract)) {
                                return { text: page.extract, sourceLang: lang, title: page.title };
                            }
                        }
                    }
                } catch (e) {}
            }

            // Шаг 2: Прямой поиск статьи по названию населённого пункта (с уточнением повята для сёл и защитой от Disambiguation)
            const directQueries = [];
            if (currentPlaceIntlCity && currentPlaceIntlCounty) {
                directQueries.push({ lang: 'pl', title: `${currentPlaceIntlCity} (powiat ${currentPlaceIntlCounty.toLowerCase()})` });
                directQueries.push({ lang: wikiLang, title: `${currentPlaceLocalName} (${currentPlaceIntlCounty})` });
            }
            langPriority.forEach(l => {
                if (currentPlaceLocalName) directQueries.push({ lang: l, title: currentPlaceLocalName });
                if (currentPlaceIntlCity) directQueries.push({ lang: l, title: currentPlaceIntlCity });
            });

            for (const cand of directQueries) {
                try {
                    const data = await fetchWikimediaJsonp(`https://${cand.lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(cand.title)}&prop=extracts|pageprops&explaintext=1&redirects=1`);
                    if (data && data.query && data.query.pages) {
                        const page = Object.values(data.query.pages)[0];
                        if (page && page.extract && page.extract.length > 80 && !isDisambiguationPage(page, page.extract)) {
                            return { text: page.extract, sourceLang: cand.lang, title: page.title };
                        }
                    }
                } catch (e) {}
            }

            return { text: '', sourceLang: wikiLang, title: currentPlaceLocalName };
        }

        async function updateGlobalPassportAndMaps(reqId) {
            const wikiLang = currentLang === 'ua' ? 'uk' : currentLang;
            const lat = currentCoords[0];
            const lon = currentCoords[1];
            const t = i18n[currentLang];

            let geoList = [];
            try {
                const backupLang = currentPlaceIntlCountry === 'Poland' ? 'pl' : (currentPlaceIntlCountry === 'Germany' ? 'de' : 'en');
                const [geoData, geoDataBackup] = await Promise.all([
                    fetchWikimediaJsonp(`https://${wikiLang}.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lon}&gsradius=10000&gslimit=14`),
                    wikiLang !== backupLang
                        ? fetchWikimediaJsonp(`https://${backupLang}.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lon}&gsradius=10000&gslimit=12`)
                        : Promise.resolve(null)
                ]);
                if (reqId !== currentRequestId) return;

                if (geoData && geoData.query && geoData.query.geosearch) {
                    geoList = geoData.query.geosearch.filter(item => isCleanHistoricalObject(item.title));
                }
                if (geoDataBackup && geoDataBackup.query && geoDataBackup.query.geosearch) {
                    geoDataBackup.query.geosearch.forEach(bItem => {
                        if (isCleanHistoricalObject(bItem.title) && !geoList.some(g => Math.abs(g.lat - bItem.lat) < 0.002)) {
                            geoList.push({ ...bItem, backupLang });
                        }
                    });
                }
            } catch(e) {}

            if (reqId !== currentRequestId) return;

            currentPinsList = [];
            geoList.slice(0, 8).forEach((item, idx) => {
                const pType = idx < 2 ? 'fact' : (idx < 5 ? 'hypo' : 'myth');
                const sym = pType === 'fact' ? '🟢' : (pType === 'hypo' ? '🟡' : '🔴');
                const cleanTitleNoParen = item.title.replace(/\s*\([^)]*\)/g, '').trim();
                const shortWords = cleanTitleNoParen.split(/[\s,]+/).slice(0, 2).join(' ');
                currentPinsList.push({
                    type: pType,
                    coords: [item.lat, item.lon],
                    shortLabel: `${sym} ${shortWords}`,
                    fullLabel: `${sym} ${item.title}`,
                    pageid: item.pageid
                });
            });

            if (currentPinsList.length === 0) {
                currentPinsList.push({
                    type: 'fact',
                    coords: [lat, lon],
                    shortLabel: `🟢 ${currentPlaceLocalName.split(' ')[0]}`,
                    fullLabel: `🟢 ${currentPlaceLocalName}`
                });
            }

            renderHistoricalPins();

            const [articlesMapRes, cityArticleObj] = await Promise.all([
                (async () => {
                    const primaryIds = geoList.filter(g => !g.backupLang).slice(0, 5).map(g => g.pageid).join('|');
                    if (!primaryIds) return {};
                    const extData = await fetchWikimediaJsonp(`https://${wikiLang}.wikipedia.org/w/api.php?action=query&pageids=${primaryIds}&prop=extracts&exintro=1&explaintext=1`);
                    return (extData && extData.query && extData.query.pages) ? extData.query.pages : {};
                })(),
                fetchBestCityArticle(wikiLang, lat, lon)
            ]);

            if (reqId !== currentRequestId) return;

            const articlesMap = articlesMapRes || {};
            const mainCityFullText = cityArticleObj.text;

            extractedHistoricalNames = extractOldNamesFromWikiText(mainCityFullText);
            if (currentPlaceIntlCity && isValidHistoricalToponym(currentPlaceIntlCity) && !extractedHistoricalNames.includes(currentPlaceIntlCity)) {
                extractedHistoricalNames.unshift(currentPlaceIntlCity);
            }

            const OrderedExtracts = geoList.slice(0, 6).map(g => {
                const p = articlesMap[g.pageid];
                return { title: g.title, text: (p && p.extract) ? p.extract : '' };
            }).filter(x => x.text.length > 20 && x.title.toLowerCase() !== currentPlaceLocalName.toLowerCase());

            const richHistoryText = extractHistoricalSectionText(
                mainCityFullText,
                OrderedExtracts[0] ? `${OrderedExtracts[0].title}: ${OrderedExtracts[0].text}` : `${currentPlaceLocalName}`
            );

            const block2Item = OrderedExtracts[0];
            const block2Text = block2Item ? `<b>${block2Item.title}:</b> ${block2Item.text}` : `${currentPlaceLocalName}`;
            const block3Item = OrderedExtracts[1] || OrderedExtracts[0];
            const block3Text = block3Item ? `<b>${block3Item.title}:</b> ${block3Item.text}` : `${currentPlaceLocalName}`;

            const trimText = (str, maxLen = 480) => str.length > maxLen ? str.slice(0, maxLen) + '...' : str;

            document.getElementById('triangulationNote').innerText = t.triangNote;

            const panel = document.getElementById('passportPanel');
            const nearbyNames = geoList.map(g => g.title).slice(0, 5).join(' • ') || currentPlaceLocalName;
            const aliasesHtml = extractedHistoricalNames.length > 0
                ? `<div class="hist-aliases">🕰️ <b>Исторические / архивные топонимы:</b> ${extractedHistoricalNames.join(', ')}</div>`
                : '';

            panel.innerHTML = `
                <div class="passport-section">
                    <h3>🏛️ ${t.sovereignty}</h3>
                    <p><b>📍 ${currentPlaceLocalName}</b> (${currentPlaceIntlCounty ? currentPlaceIntlCounty + ', ' : ''}${currentPlaceIntlState ? currentPlaceIntlState + ', ' : ''}${currentPlaceIntlCountry})</p>
                    ${aliasesHtml}
                    <p style="margin-top:6px;"><b>${t.names}</b> ${nearbyNames}</p>
                    <div class="source-ref" id="activeMapRefBox">📜 <b>${t.mapSourceLabel}</b> Поиск датированных карт (до 1945 г.)...</div>
                </div>

                <div class="passport-section clickable-card" onclick="flyToMarkerType('fact')">
                    <h3 class="tag-fact">${t.mainHistoryTitle} <span class="fly-hint">${t.flyToPin}</span></h3>
                    <p>${richHistoryText}</p>
                    <div class="source-ref">📚 ${t.source} Wikipedia GeoPageID (${cityArticleObj.sourceLang}.wikipedia.org — ${cityArticleObj.title})</div>
                </div>

                <div class="passport-section clickable-card" onclick="flyToMarkerType('hypo')">
                    <h3 class="tag-hypo">${t.monumentsTitle} <span class="fly-hint">${t.flyToPin}</span></h3>
                    <p>${trimText(block2Text, 460)}</p>
                    <div class="source-ref">📚 ${t.source} GeoSearch (Радиус 10 км)</div>
                </div>

                <div class="passport-section clickable-card" onclick="flyToMarkerType('myth')">
                    <h3 class="tag-myth">${t.surroundingsTitle} <span class="fly-hint">${t.flyToPin}</span></h3>
                    <p>${trimText(block3Text, 460)}</p>
                    <div class="source-ref">📚 ${t.source} Региональная энциклопедическая база</div>
                </div>
            `;

            document.getElementById('modern-label').innerText = t.modernLabel;
            document.getElementById('globalSearchInput').placeholder = t.searchPlaceholder;
            document.getElementById('searchBtn').innerText = t.searchBtn;
            document.getElementById('tabMapBtn').innerText = t.tabMap;
            document.getElementById('tabScanBtn').innerText = t.tabScan;
            document.getElementById('tabOverlayBtn').innerText = t.tabOverlay;
            document.getElementById('tabSwipeBtn').innerText = t.tabSwipe;
            document.getElementById('opacityLabelText').innerText = t.opacityLabel;
            document.getElementById('yearInputLabel').innerText = t.yearLabel;
            document.getElementById('warpToggleBtn').innerText = isWarpMode ? t.modeWarpScan : t.modeMoveMap;

            await fetchAllHistoricalMapsWithYears(reqId);
        }

        // ЖЁСТКИЙ JS-ФИЛЬТР КАРТ WIKIMEDIA COMMONS (отсекает фото зданий, ЛЭП, фонтанов, гербов и современные схемы 1946–2026)
        const COMMONS_GARBAGE_REGEX = /flag|coat_of_arms|herb|wappen|logo|locator|location_map|outline_map|blank_map|symbol|stamp|coin|banknote|medal|portrait|photo|photograph|demography|election|census|population|building|church|kirche|kościół|cathedral|chapel|synagogue|mosque|station|bahnhof|dworzec|fountain|brunnen|fontanna|power|transmission|pylon|mast|tower|turm|wieża|street|ulica|straße|aerial|drone|satellite|modern|battle_of|offensive|frontline|military_situation|201\d|202\d|19[5-9]\d|view_of|panorama|monument|statue|memorial|pomnik|denkmal|bridge|most|brücke|cemetery|friedhof|cmentarz|palace|pałac|schloss|castle_ruin|train|tram|bus|park|garden|painting|grave|tomb|plaque|inscription|seal|banner|diagram|graph|chart_of|municipality_map|powiat_locator|gmina_locator|administrative|subdivisions|districts_of|raions_of/i;

        const POSITIVE_MAP_TITLE_REGEX = /(map|maps|plan|plans|karte|karten|stadtplan|mapa|mapy|atlas|tabula|chart|topograph|messtischblatt|kreiskarte|спецкарта|карта|карты|план|планы|атлас|чертеж|чертёж)/i;

        // Простые и 100% совместимые с CirrusSearch запросы к gsrnamespace=6, а вся жёсткая фильтрация выполняется в JS
        async function runCommonsBatchQueries(rawSearchTerms, seenUrls, scaleTag) {
            const datedFound = [];
            const undatedBackup = [];

            const promises = rawSearchTerms.map(term => {
                const fullSearch = `filetype:bitmap ${term}`;
                const apiUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(fullSearch)}&gsrlimit=15&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1280`;
                return fetchWikimediaJsonp(apiUrl);
            });

            const results = await Promise.all(promises);
            results.forEach(data => {
                if (!data || !data.query || !data.query.pages) return;
                Object.values(data.query.pages).forEach(p => {
                    if (!p.imageinfo || !p.imageinfo[0]) return;
                    const info = p.imageinfo[0];
                    const imgUrl = info.thumburl || info.url;
                    const origUrl = info.url || imgUrl;
                    const cleanTitle = (p.title || '').replace(/^File:/i, '').replace(/\.(jpg|jpeg|png|svg|tif|tiff|gif)$/i, '');

                    if (!imgUrl || seenUrls.has(imgUrl)) return;

                    const catVal = (info.extmetadata && info.extmetadata.Categories && info.extmetadata.Categories.value)
                        ? String(info.extmetadata.Categories.value)
                        : '';
                    const descVal = (info.extmetadata && info.extmetadata.ImageDescription && info.extmetadata.ImageDescription.value)
                        ? String(info.extmetadata.ImageDescription.value).replace(/<[^>]+>/g, ' ')
                        : '';

                    // 1. В заголовке или категориях обязательно должно быть слово map/plan/karte/mapa/atlas/карта/план
                    if (!POSITIVE_MAP_TITLE_REGEX.test(cleanTitle) && !POSITIVE_MAP_TITLE_REGEX.test(catVal)) return;

                    // 2. Жёсткий бан-лист против фото зданий, костёлов, ЛЭП, фонтанов, схем выборов и современных боёв
                    if (COMMONS_GARBAGE_REGEX.test(cleanTitle)) return;
                    if (/\b(201\d|202\d|Russian invasion|power line|fountain|church building|train station|modern map|locator map)\b/i.test(descVal + ' ' + catVal)) return;

                    // 3. Строгий парсинг реального исторического года <= 1945
                    const strictYear = extractStrictHistoricalYear(cleanTitle, info.extmetadata);
                    if (strictYear !== null && strictYear <= 1945) {
                        seenUrls.add(imgUrl);
                        datedFound.push({
                            url: imgUrl,
                            origUrl: origUrl,
                            title: cleanTitle,
                            year: strictYear,
                            scaleTag: scaleTag
                        });
                    } else if (!/\b(19[4-9]\d|20[0-2]\d)\b/.test(cleanTitle + ' ' + catVal)) {
                        // Если в файле явно есть Old maps / Historical maps в категориях, но точный год не распарсился — держим в резерве
                        if (/old maps|historical maps|maps of .* history|1[6-9]th-century maps/i.test(catVal + ' ' + cleanTitle)) {
                            seenUrls.add(imgUrl);
                            undatedBackup.push({
                                url: imgUrl,
                                origUrl: origUrl,
                                title: cleanTitle,
                                year: 1850,
                                isApproxEpoch: true,
                                scaleTag: scaleTag
                            });
                        }
                    }
                });
            });

            return { datedFound, undatedBackup };
        }

        async function fetchAllHistoricalMapsWithYears(reqId) {
            const loader = document.getElementById('scanLoadingBadge');
            const galInfo = document.getElementById('galInfoText');
            const scanImg = document.getElementById('archiveScanImg');

            loader.classList.add('visible');
            galInfo.innerText = `⏳ Поиск подлинных карт (до 1945 г.)...`;

            const city = (currentPlaceIntlCity || currentPlaceLocalName || '').replace(/\s*\([^)]*\)/g, '').trim();
            const localCity = (currentPlaceLocalName || '').replace(/\s*\([^)]*\)/g, '').trim();
            const county = currentPlaceIntlCounty || '';
            const state = currentPlaceIntlState || '';

            // Собираем ВСЕ уникальные исторические имена города (включая Danzig, Александровск, Aleksandrovsk, Kiev и т.д.)
            const allNames = Array.from(new Set([
                city,
                ...extractedHistoricalNames,
                localCity
            ].filter(n => n && n.length >= 3)));

            const seenUrls = new Set();
            let collectedScans = [];
            let backupUndated = [];

            // СТУПЕНЬ 1 (Локальная): Формируем простые совместимые запросы по ВСЕМ историческим именам города/села
            const tier1Queries = [];
            allNames.forEach(name => {
                if (/^[A-Za-zÄÖÜäöüßŚĆŻŹŁŃśćżźłń\s\-]+$/.test(name)) {
                    tier1Queries.push(`map ${name}`);
                    tier1Queries.push(`plan ${name}`);
                    tier1Queries.push(`karte ${name}`);
                } else {
                    tier1Queries.push(`план ${name}`);
                    tier1Queries.push(`карта ${name}`);
                }
            });

            if (tier1Queries.length > 0) {
                const res1 = await runCommonsBatchQueries(tier1Queries.slice(0, 12), seenUrls, 'Локальная');
                if (reqId !== currentRequestId) return;
                collectedScans.push(...res1.datedFound);
                backupUndated.push(...res1.undatedBackup);
            }

            // СТУПЕНЬ 2 (Уезд / Повят и Исторический регион): если по самому населённому пункту нашлось меньше 5 датированных карт
            if (collectedScans.length < 5) {
                const tier2Queries = [
                    county ? `map ${county}` : '',
                    county ? `karte ${county}` : '',
                    state ? `map ${state} 18th` : '',
                    state ? `map ${state} 19th` : '',
                    state ? `old map ${state}` : '',
                    state ? `karte ${state}` : ''
                ].filter(Boolean);

                if (tier2Queries.length > 0) {
                    const res2 = await runCommonsBatchQueries(tier2Queries, seenUrls, 'Регион');
                    if (reqId !== currentRequestId) return;
                    collectedScans.push(...res2.datedFound);
                    backupUndated.push(...res2.undatedBackup);
                }
            }

            // Если точных датированных карт мало (< 2), дополняем проверенными архивными картами из резерва
            if (collectedScans.length < 2 && backupUndated.length > 0) {
                collectedScans.push(...backupUndated.slice(0, 6));
            }

            // Сортируем строго по историческому году
            collectedScans.sort((a, b) => a.year - b.year);
            currentArchiveScans = collectedScans;
            loader.classList.remove('visible');

            renderGoldMilestonesUI();

            if (currentArchiveScans.length > 0) {
                snapToNearestMapByYear(selectedYear);
            } else {
                scanImg.classList.remove('loaded');
                scanImg.src = '';
                galInfo.innerText = `⚠️ Нет датированных карт (≤1945 г.)`;
                document.getElementById('epochBadge').innerText = `Нет карт ≤1945`;
                document.getElementById('nearestYearHint').innerText = `0 карт`;
                const refBox = document.getElementById('activeMapRefBox');
                if (refBox) {
                    refBox.innerHTML = `📜 <b>Архив Wikimedia:</b> Для данной точки не найдено оцифрованных карт с подтверждённой датой до 1945 г.`;
                }
            }
        }

        function renderGoldMilestonesUI() {
            const bar = document.getElementById('goldMilestonesBar');
            const ticksLayer = document.getElementById('tickMarksLayer');
            bar.innerHTML = `<span class="milestones-title">🔸 Карты (≤1945):</span>`;
            ticksLayer.innerHTML = ``;

            if (currentArchiveScans.length === 0) {
                const emptySpan = document.createElement('span');
                emptySpan.style.fontSize = '0.68rem';
                emptySpan.style.color = '#888';
                emptySpan.innerText = 'не найдено подлинных датированных сканов';
                bar.appendChild(emptySpan);
                return;
            }

            currentArchiveScans.forEach((scan, idx) => {
                const chip = document.createElement('button');
                chip.className = 'gold-chip' + (idx === currentScanIdx ? ' active' : '');
                const yearLabel = scan.isApproxEpoch ? `~${scan.year} г.` : `${scan.year} г.`;
                chip.innerText = `🔸 ${yearLabel}`;
                chip.title = `[${scan.scaleTag}] ${scan.title}`;
                chip.onclick = () => {
                    currentScanIdx = idx;
                    selectedYear = scan.year;
                    document.getElementById('timeSlider').value = Math.min(Math.max(100, selectedYear), 1950);
                    document.getElementById('customYearInput').value = selectedYear;
                    showCurrentGalleryScan(0);
                    highlightActiveGoldChip();
                };
                bar.appendChild(chip);

                const pct = ((Math.min(Math.max(100, scan.year), 1950) - 100) / (1950 - 100)) * 100;
                const tick = document.createElement('div');
                tick.className = 'gold-tick';
                tick.style.left = `${pct}%`;
                ticksLayer.appendChild(tick);
            });
        }

        function highlightActiveGoldChip() {
            const chips = document.querySelectorAll('.gold-chip');
            chips.forEach((c, idx) => c.classList.toggle('active', idx === currentScanIdx));
        }

        function snapToNearestMapByYear(targetYear) {
            if (currentArchiveScans.length === 0) return;
            let bestIdx = 0;
            let minDiff = Math.abs(currentArchiveScans[0].year - targetYear);
            for (let i = 1; i < currentArchiveScans.length; i++) {
                const diff = Math.abs(currentArchiveScans[i].year - targetYear);
                if (diff < minDiff) {
                    minDiff = diff;
                    bestIdx = i;
                }
            }
            currentScanIdx = bestIdx;
            const matchedYear = currentArchiveScans[bestIdx].year;
            const diff = matchedYear - targetYear;
            showCurrentGalleryScan(diff);
            highlightActiveGoldChip();
        }

        function onContinuousSliderInput(val) {
            selectedYear = parseInt(val, 10);
            document.getElementById('customYearInput').value = selectedYear;
            snapToNearestMapByYear(selectedYear);
        }

        function jumpToCustomYear() {
            const val = parseInt(document.getElementById('customYearInput').value, 10);
            if (isNaN(val)) return;
            selectedYear = val;
            document.getElementById('timeSlider').value = Math.min(Math.max(100, val), 1950);
            snapToNearestMapByYear(val);
        }

        function stepMilestone(dir) {
            if (currentArchiveScans.length === 0) return;
            currentScanIdx = (currentScanIdx + dir + currentArchiveScans.length) % currentArchiveScans.length;
            selectedYear = currentArchiveScans[currentScanIdx].year;
            document.getElementById('timeSlider').value = Math.min(Math.max(100, selectedYear), 1950);
            document.getElementById('customYearInput').value = selectedYear;
            showCurrentGalleryScan(0);
            highlightActiveGoldChip();
        }

        function showCurrentGalleryScan(yearDiff = 0) {
            if (currentArchiveScans.length === 0) return;
            const item = currentArchiveScans[currentScanIdx];
            const scanImg = document.getElementById('archiveScanImg');
            const galInfo = document.getElementById('galInfoText');
            const loader = document.getElementById('scanLoadingBadge');
            const t = i18n[currentLang];

            loader.classList.add('visible');
            scanImg.onload = () => {
                loader.classList.remove('visible');
                scanImg.classList.add('loaded');
            };
            scanImg.onerror = () => {
                loader.classList.remove('visible');
            };
            scanImg.src = item.url;
            const scaleBadge = item.scaleTag ? `[${item.scaleTag}] ` : '';
            const yText = item.isApproxEpoch ? `~${item.year} г.` : `${item.year} г.`;
            galInfo.innerText = `📜 ${currentScanIdx + 1}/${currentArchiveScans.length} (${yText}) ${scaleBadge}${item.title}`;

            document.getElementById('epochBadge').innerText = `Карта: ${yText}`;
            const sign = yearDiff > 0 ? `+${yearDiff}` : `${yearDiff}`;
            document.getElementById('nearestYearHint').innerText = yearDiff === 0 ? `Точно: ${yText}` : `Запрос ${selectedYear} ➔ карта ${yText} (${sign} л.)`;

            const refBox = document.getElementById('activeMapRefBox');
            if (refBox) {
                refBox.innerHTML = `📜 <b>${t.mapSourceLabel}</b> ${scaleBadge}${item.title} (<b>${yText}</b>) — <a href="${item.origUrl}" target="_blank" style="color:#ffd700;text-decoration:underline;">Оригинал Wikimedia ↗</a>`;
            }
        }

        function openOriginalScan() {
            if (currentArchiveScans.length === 0 || !currentArchiveScans[currentScanIdx]) return;
            const item = currentArchiveScans[currentScanIdx];
            window.open(item.origUrl || item.url, '_blank');
        }

        function resetScanCalibrationOnly() {
            scanScale = 1; panX = 0; panY = 0; isRotated = false;
            applyScanTransform();
        }

        function stepArchiveScan(dir) {
            stepMilestone(dir);
        }

        function renderHistoricalPins() {
            if (!historicPinsLayer) return;
            historicPinsLayer.clearLayers();
            activeMarkersByType = { fact: null, hypo: null, myth: null };

            currentPinsList.forEach(p => {
                if (pinFilter !== 'all' && p.type !== pinFilter) return;
                const cssClass = p.type === 'fact' ? 'pin-fact' : (p.type === 'hypo' ? 'pin-hypo' : 'pin-myth');
                const icon = L.divIcon({
                    className: '',
                    html: `<div class="hist-pin-short ${cssClass}" title="${p.fullLabel}">${p.shortLabel}</div>`,
                    iconSize: [0, 0]
                });
                const marker = L.marker(p.coords, { icon: icon }).addTo(historicPinsLayer).bindPopup(`<b>${p.fullLabel}</b>`);
                if (!activeMarkersByType[p.type]) activeMarkersByType[p.type] = marker;
            });
        }

        function setPinFilter(filterType, btnEl) {
            pinFilter = filterType;
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            renderHistoricalPins();
        }

        function flyToMarkerType(type) {
            if (window.innerWidth <= 950) {
                switchMobilePane('historicPane', document.getElementById('mobBtnHist'));
            }
            if (rightMode === 'scan') setRightMode('map');
            const m = activeMarkersByType[type];
            if (m && historicMap) {
                setTimeout(() => {
                    historicMap.invalidateSize();
                    historicMap.flyTo(m.getLatLng(), 14, { duration: 0.6 });
                    setTimeout(() => m.openPopup(), 650);
                }, 100);
            }
        }

        function toggleModernLayer() {
            if (!modernMap) return;
            isSatellite = !isSatellite;
            if (isSatellite) { modernMap.removeLayer(modernStreet); modernSat.addTo(modernMap); }
            else { modernMap.removeLayer(modernSat); modernStreet.addTo(modernMap); }
        }

        function setRightMode(mode) {
            rightMode = mode;
            const scanLayer = document.getElementById('scanLayer');
            const galBar = document.getElementById('scanGalleryBar');
            const subOverlay = document.getElementById('overlaySubControls');
            const triNote = document.getElementById('triangulationNote');
            const swipeHandle = document.getElementById('swipeHandle');
            const zIn = document.getElementById('zoomInScanBtn');
            const zOut = document.getElementById('zoomOutScanBtn');

            ['Map', 'Scan', 'Overlay', 'Swipe'].forEach(m => {
                document.getElementById('tab' + m + 'Btn').classList.toggle('active', mode === m.toLowerCase());
            });

            scanLayer.className = 'scan-layer';
            scanLayer.style.clipPath = 'none';
            galBar.classList.remove('visible');
            subOverlay.classList.remove('visible');
            triNote.classList.remove('visible');
            swipeHandle.classList.remove('active');
            zIn.style.display = 'none';
            zOut.style.display = 'none';

            if (mode === 'map') {
                applyScanTransform();
                if (historicMap) setTimeout(() => historicMap.invalidateSize(), 50);
            } else if (mode === 'scan') {
                scanLayer.classList.add('mode-scan');
                scanLayer.style.opacity = '1';
                galBar.classList.add('visible');
                zIn.style.display = 'block';
                zOut.style.display = 'block';
                applyScanTransform();
            } else if (mode === 'overlay') {
                scanLayer.classList.add('mode-overlay');
                if (isWarpMode) scanLayer.classList.add('interactive-warp');
                scanLayer.style.opacity = overlayOpacity;
                galBar.classList.add('visible');
                subOverlay.classList.add('visible');
                triNote.classList.add('visible');
                zIn.style.display = 'block';
                zOut.style.display = 'block';
                applyScanTransform();
            } else if (mode === 'swipe') {
                scanLayer.classList.add('mode-swipe');
                scanLayer.style.opacity = '1';
                galBar.classList.add('visible');
                swipeHandle.classList.add('active');
                zIn.style.display = 'block';
                zOut.style.display = 'block';
                updateSwipeClip(swipePercent);
            }
        }

        const swipeHandleEl = document.getElementById('swipeHandle');
        const historicPaneEl = document.getElementById('historicPane');

        function updateSwipeClip(pct) {
            swipePercent = Math.min(Math.max(5, pct), 95);
            swipeHandleEl.style.left = swipePercent + '%';
            const scanLayer = document.getElementById('scanLayer');
            scanLayer.style.clipPath = `polygon(0 0, ${swipePercent}% 0, ${swipePercent}% 100%, 0 100%)`;
        }

        swipeHandleEl.addEventListener('mousedown', () => { isDraggingSwipe = true; });
        swipeHandleEl.addEventListener('touchstart', () => { isDraggingSwipe = true; }, { passive: true });
        window.addEventListener('mousemove', (e) => {
            if (!isDraggingSwipe) return;
            const rect = historicPaneEl.getBoundingClientRect();
            updateSwipeClip(((e.clientX - rect.left) / rect.width) * 100);
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDraggingSwipe || !e.touches[0]) return;
            const rect = historicPaneEl.getBoundingClientRect();
            updateSwipeClip(((e.touches[0].clientX - rect.left) / rect.width) * 100);
        }, { passive: true });
        window.addEventListener('mouseup', () => { isDraggingSwipe = false; });
        window.addEventListener('touchend', () => { isDraggingSwipe = false; });

        function updateOverlayOpacity(val) {
            overlayOpacity = parseInt(val) / 100;
            if (rightMode === 'overlay') document.getElementById('scanLayer').style.opacity = overlayOpacity;
        }

        function toggleWarpMode() {
            isWarpMode = !isWarpMode;
            const scanLayer = document.getElementById('scanLayer');
            const btn = document.getElementById('warpToggleBtn');
            const t = i18n[currentLang];
            scanLayer.classList.toggle('interactive-warp', isWarpMode);
            btn.classList.toggle('active', isWarpMode);
            btn.innerText = isWarpMode ? t.modeWarpScan : t.modeMoveMap;
        }

        function resetCenter() {
            scanScale = 1; panX = 0; panY = 0; isRotated = false;
            applyScanTransform();
            if (modernMap) modernMap.setView(currentCoords, 12);
        }

        function applyScanTransform() {
            const deg = isRotated ? 180 : 0;
            document.getElementById('scanWrapper').style.transform = `translate(${panX}px, ${panY}px) scale(${scanScale}) rotate(${deg}deg)`;
            document.getElementById('historicMap').style.transform = (rightMode === 'map') ? `rotate(${deg}deg)` : 'rotate(0deg)';
            document.getElementById('compassArrow').innerText = isRotated ? `⬇️` : `⬆️`;
            document.getElementById('compassText').innerText = isRotated ? `ЮГ` : `N`;
        }

        function zoomScan(delta) {
            scanScale = Math.min(Math.max(0.4, scanScale + delta), 5);
            applyScanTransform();
        }

        function toggleRotation() {
            isRotated = !isRotated;
            applyScanTransform();
        }

        const scanLayerEl = document.getElementById('scanLayer');
        scanLayerEl.addEventListener('wheel', function(e) {
            if (rightMode === 'scan' || (rightMode === 'overlay' && isWarpMode)) {
                e.preventDefault();
                zoomScan(e.deltaY < 0 ? 0.2 : -0.2);
            }
        });
        scanLayerEl.addEventListener('mousedown', function(e) {
            if (rightMode === 'scan' || (rightMode === 'overlay' && isWarpMode)) {
                isDraggingScan = true; startX = e.clientX - panX; startY = e.clientY - panY;
            }
        });
        scanLayerEl.addEventListener('touchstart', function(e) {
            if ((rightMode === 'scan' || (rightMode === 'overlay' && isWarpMode)) && e.touches[0]) {
                isDraggingScan = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY;
            }
        }, { passive: true });
        window.addEventListener('mousemove', function(e) {
            if (!isDraggingScan) return;
            panX = e.clientX - startX; panY = e.clientY - startY; applyScanTransform();
        });
        window.addEventListener('touchmove', function(e) {
            if (!isDraggingScan || !e.touches[0]) return;
            panX = e.touches[0].clientX - startX; panY = e.touches[0].clientY - startY; applyScanTransform();
        }, { passive: true });
        window.addEventListener('mouseup', () => { isDraggingScan = false; });
        window.addEventListener('touchend', () => { isDraggingScan = false; });

        function setLang(lang, btnEl) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            document.getElementById('mobDrawerBtn').innerText = `🔍 Поиск / ${lang.toUpperCase()} ▾`;
            closeMobileDrawer();
            exploreWorldPoint(currentCoords[0], currentCoords[1], null);
        }

        exploreWorldPoint(54.2611, 18.6361, null);
    </script>
</body>
</html>
